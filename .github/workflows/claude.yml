# Pedido livre ao Claude Code (docs/metodologia.md).
#
# A Diretoria escreve "@claude" e o pedido num comentário de issue ou de PR (por exemplo,
# "@claude atualize este PR com a main") e o Claude Code atende ali mesmo.
# Se falhar, marca a issue ou o PR com "falha de agente" para o DevOps resolver.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == 'diretoria823'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 150
            --allowedTools "Read,Write,Edit,Glob,Grep,Skill,Bash"

      # Só em falha: busca as funções da esteira na main e marca a issue ou o PR para o DevOps.
      - if: failure()
        uses: actions/checkout@v5
        with:
          ref: main
          path: _esteira
          sparse-checkout: .github/scripts

      - name: Marcar a falha
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { marcarFalha } = await import(`${process.env.GITHUB_WORKSPACE}/_esteira/.github/scripts/agentes.mjs`);
            await marcarFalha({ github, context, core, agente: 'claude', numero: (context.payload.issue ?? context.payload.pull_request).number });
