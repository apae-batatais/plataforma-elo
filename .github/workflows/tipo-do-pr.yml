# Tipo do PR (docs/metodologia.md).
#
# Confere a etiqueta de tipo com a referência à issue:
#   "PR: especificação" + linha "Especifica #n"  |  "PR: entrega" + linha "Entrega #n"
# PR de manutenção (sem etiqueta e sem referência) passa. Leva segundos e não instala nada.
# O workflow Aprovação faz a mesma conferência antes do merge.

name: Tipo do PR

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

# Sem fila: cada evento confere as etiquetas atuais do PR (lidas na hora), então rodadas
# seguidas dão o mesmo resultado e nenhuma aparece como cancelada no PR.

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - uses: actions/github-script@v7
        with:
          script: |
            const { tipoDoPR } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/fluxo-quadro.mjs`);
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: context.payload.pull_request.number });
            const r = tipoDoPR({ etiquetas: pr.labels.map((l) => l.name), texto: `${pr.title}\n${pr.body ?? ''}` });
            if (r.erro) core.setFailed(r.erro);
            else core.notice(r.tipo ? `PR de ${r.tipo === 'especificacao' ? 'especificação' : 'entrega'} da issue #${r.issues.join(', #')}.` : 'PR de manutenção (não move proposta).');
