name: Verificar

on:
  pull_request:
  push:
    branches: [main]
  # Chamado pelo workflow Aprovação depois de cada merge: o merge feito pela automação não
  # dispara o "push" acima, e a main precisa ser verificada com as entregas juntas.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Regras de fronteira entre módulos
        run: npm run fronteiras
      - name: Testes (inclui acesso por perfil no banco)
        run: npm run test
      - name: Build de produção
        run: npm run build
