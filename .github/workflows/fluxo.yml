# Fluxo de trabalho do Elo (docs/metodologia.md).
#
# Troca a etiqueta "etapa: …" das propostas (issues) conforme os PRs e a
# publicação, e copia a etapa para o quadro do GitHub Projects.
#
# O quadro é opcional. Para ligar, cadastre no repositório
# (Settings → Secrets and variables → Actions):
#   Secret    QUADRO_TOKEN   chave de acesso com permissão de escrita no projeto
#   Variable  QUADRO_NUMERO  número do projeto (aparece no endereço: .../projects/<número>)
# Sem eles, só as etiquetas são atualizadas.

name: Fluxo

on:
  issues:
    types: [opened, labeled, unlabeled]
  pull_request:
    types: [opened, reopened, edited, labeled, unlabeled, ready_for_review, converted_to_draft, closed]
  workflow_run:
    workflows: [Publicar]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

# Um evento por issue ou PR de cada vez; eventos de issues diferentes rodam em paralelo.
concurrency:
  group: fluxo-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  fluxo:
    runs-on: ubuntu-latest
    # Só roda quando o evento pode mudar uma etapa (job pulado não gasta minutos):
    # - issue aberta, ou etiqueta "etapa: …" posta ou tirada;
    # - PR com etiqueta de tipo ("PR: especificação" ou "PR: entrega"), fora de forks;
    # - publicação oficial (não as prévias); sincronização à mão.
    if: >-
      (github.event_name == 'issues' && (github.event.action == 'opened' || startsWith(github.event.label.name, 'etapa: '))) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
        (contains(github.event.pull_request.labels.*.name, 'PR: especificação') || contains(github.event.pull_request.labels.*.name, 'PR: entrega'))) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event != 'pull_request') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        env:
          QUADRO_TOKEN: ${{ secrets.QUADRO_TOKEN }}
          QUADRO_NUMERO: ${{ vars.QUADRO_NUMERO }}
        with:
          script: |
            const { executar } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/fluxo-quadro.mjs`);
            await executar({
              github, context, core,
              tokenQuadro: process.env.QUADRO_TOKEN,
              numeroQuadro: process.env.QUADRO_NUMERO,
            });
