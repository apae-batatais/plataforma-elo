# Fila de construção (ADR-031, docs/metodologia.md).
#
# No máximo 2 entregas em construção ao mesmo tempo, na ordem do quadro "Elo". Chamado pela
# Aprovação depois de cada merge (abre vaga quando uma entrega é aprovada; entra na fila quando uma
# especificação é aprovada). À mão: Actions → Fila → Run workflow (por exemplo, depois que a
# Diretoria disser "pode seguir" e o DevOps tirar a pausa por cota).
# Funções em .github/scripts/fila.mjs, com teste em tests/fluxo/fila.test.ts.

name: Fila

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

# Uma conferência por vez; a que espera é substituída pela mais nova, que relê tudo.
concurrency:
  group: fila
  cancel-in-progress: false

jobs:
  chamar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - uses: actions/github-script@v7
        env:
          QUADRO_TOKEN: ${{ secrets.QUADRO_TOKEN }}
          QUADRO_NUMERO: ${{ vars.QUADRO_NUMERO }}
        with:
          script: |
            const { chamarProximas } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/fila.mjs`);
            await chamarProximas({ github, context, core, tokenQuadro: process.env.QUADRO_TOKEN, numeroQuadro: process.env.QUADRO_NUMERO });
