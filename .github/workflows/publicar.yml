# Publicação na Netlify feita pelo GitHub (ADR-011).
#
# - Mudança na main → publica a versão oficial (produção).
# - Pull Request    → publica uma prévia e comenta o link no PR.
#
# Precisa de dois Secrets no repositório (Settings → Secrets and variables → Actions):
#   NETLIFY_AUTH_TOKEN  chave pessoal de acesso da Netlify
#   NETLIFY_SITE_ID     identificador do site na Netlify (Project configuration → Project ID)
# Sem eles, a publicação é pulada e a verificação continua normal.

name: Publicar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: publicar-${{ github.event.pull_request.number || 'producao' }}
  cancel-in-progress: true

env:
  NETLIFY_CLI: netlify-cli@27.11.2

jobs:
  publicar:
    runs-on: ubuntu-latest
    # Pull Requests de cópias externas do repositório (forks) não recebem os Secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Conferir configuração
        id: config
        env:
          TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SITE: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$SITE" ]; then
            echo "pronto=sim" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Publicação pulada: configure NETLIFY_AUTH_TOKEN e NETLIFY_SITE_ID nos Secrets do repositório."
            echo "pronto=nao" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.config.outputs.pronto == 'sim'

      - uses: actions/setup-node@v5
        if: steps.config.outputs.pronto == 'sim'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.config.outputs.pronto == 'sim'

      - name: Publicar versão oficial
        if: steps.config.outputs.pronto == 'sim' && github.event_name == 'push'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes "$NETLIFY_CLI" deploy --build --prod --context production \
            --message "main ${GITHUB_SHA::7}" --json > publicacao.json
          echo "Endereço: $(jq -r '.url' publicacao.json)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar prévia do Pull Request
        id: previa
        if: steps.config.outputs.pronto == 'sim' && github.event_name == 'pull_request'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          npx --yes "$NETLIFY_CLI" deploy --build --context deploy-preview \
            --alias "pr-$PR" --message "PR #$PR ${GITHUB_SHA::7}" --json > publicacao.json
          url=$(jq -r '.deploy_url' publicacao.json)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Prévia: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar o link da prévia no PR
        if: steps.previa.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.previa.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marca='<!-- previa-netlify -->'
          corpo="$marca
          **Prévia pronta:** $URL

          Modo demonstração: todos os dados são fictícios. Versão ${GITHUB_SHA::7}."
          existente=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marca\")) | .id" | head -1)
          if [ -n "$existente" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existente" -f body="$corpo" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$corpo" > /dev/null
          fi
