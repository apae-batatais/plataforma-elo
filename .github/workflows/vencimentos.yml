# Vencimento das chaves (Secrets) do repositório.
#
# Toda segunda-feira às 9h (Brasília), abre uma issue "pendência da Diretoria" para cada chave
# de .github/chaves.json que vence nos próximos 30 dias ou já venceu. Não repete aviso aberto.
# Também pode ser rodado à mão: Actions → Vencimentos → Run workflow.
#
# Issues abertas por esta automação não acionam o Arquiteto nem o Fluxo (usam o GITHUB_TOKEN e
# levam a etiqueta "pendência da Diretoria").

name: Vencimentos

on:
  schedule:
    - cron: '0 12 * * 1' # segunda-feira, 9h em Brasília (12h UTC)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vencimentos
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = await import('node:fs');
            const { executar } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/vencimento-chaves.mjs`);
            const chaves = JSON.parse(fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/.github/chaves.json`, 'utf8'));
            const hoje = new Date().toLocaleDateString('sv-SE', { timeZone: 'America/Sao_Paulo' });
            await executar({ github, context, core, chaves, hoje });
