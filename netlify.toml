# Hospedagem na Netlify (ADR-011).
# A publicação é feita pelo GitHub Actions (.github/workflows/publicar.yml), porque
# o plano gratuito da Netlify não conecta repositórios privados de organizações.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Adaptador oficial do Next.js na Netlify (versão fixada no package.json).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Enquanto o Supabase não existir, produção e prévias rodam em demonstração
# (banco em memória com dados fictícios). Quando DATABASE_URL for configurada
# no painel da Netlify, a demonstração desliga sozinha nesse ambiente.
[context.production.environment]
  MODO_DEMONSTRACAO = "1"

[context.deploy-preview.environment]
  MODO_DEMONSTRACAO = "1"

[context.branch-deploy.environment]
  MODO_DEMONSTRACAO = "1"
